<meta charset="utf-8" />
<title>editor-v2</title>
<style>
  body {
    margin: 0;
    min-height: 100dvh;
    background: hsl(0, 0%, 12%);
  }

  textarea {
    width: 100%;
    height: 100dvh;
    border: none;
    background: transparent;
    font-size: 1rem;
    resize: none;
    padding: 1.5rem;
    line-height: 1.6;
    color: hsl(0 0% 80%);
    box-sizing: border-box;
    outline: none;
    -webkit-font-smoothing: antialiased;
    font-family: "Hiragino sans";
    font-weight: 300;
  }
</style>

<textarea id="memo" placeholder="入力" autofocus></textarea>

<script>
  const memo = document.getElementById("memo");
  const KEY = "editor-v2";
  memo.value = localStorage.getItem(KEY) || "";
  memo.addEventListener("input", () => {
    localStorage.setItem(KEY, memo.value);
  });
</script>
